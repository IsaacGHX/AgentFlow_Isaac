hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

agentflow:
  port: 9999
  reward_shaping_gamma: 0.99
  enable_reward_shaping: True
  reward_mode: discount

data:
  filter_overlong_prompts: false

actor_rollout_ref:
  rollout:
    mode: async
    agent:
      custom_async_server:
        path: pkg://agentflow.verl.async_server
        name: PatchedvLLMServer
